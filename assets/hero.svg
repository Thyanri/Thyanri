<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a3d41" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2b714" stop-opacity="0"/>
      <stop offset="15%" stop-color="#e2b714" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#e2b714" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e2b714" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2e31"/>
      <stop offset="100%" stop-color="#323437"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="840" height="200" fill="url(#bg-grad)" rx="6"/>

  <!-- grid overlay -->
  <rect width="840" height="200" fill="url(#grid)" rx="6"/>

  <!-- subtle top border accent -->
  <rect x="0" y="0" width="840" height="2" fill="url(#accent-line)" rx="1"/>

  <!-- left vertical accent bar -->
  <rect x="48" y="52" width="3" height="96" fill="#e2b714" opacity="0.7" rx="1.5"/>

  <!-- name -->
  <text x="72" y="100" fill="#d1d0c5" font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif" font-size="32" font-weight="600" letter-spacing="1">Thyan</text>

  <!-- tagline -->
  <text x="72" y="132" fill="#646669" font-family="'Segoe UI', 'SF Pro Text', system-ui, sans-serif" font-size="14" font-weight="400" letter-spacing="2.5">
    <tspan>software engineer</tspan>
    <tspan fill="#3a3d41" dx="8">•</tspan>
    <tspan dx="8">growth systems</tspan>
    <tspan fill="#3a3d41" dx="8">•</tspan>
    <tspan dx="8">ai automations</tspan>
  </text>

  <!-- subtle bottom line -->
  <rect x="48" y="180" width="744" height="1" fill="#3a3d41" opacity="0.5"/>

  <!-- small accent dot -->
  <circle cx="796" cy="180" r="2" fill="#e2b714" opacity="0.5"/>
</svg>
