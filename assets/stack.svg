  <text x="380" y="143" fill="#ff9900" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">▲</text>
  <text x="394" y="143" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">AWS</text>

