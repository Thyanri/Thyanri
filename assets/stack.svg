  <text x="300" y="143" fill="#2496ed" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">🐳</text>
  <text x="320" y="143" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Docker</text>

