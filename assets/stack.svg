  <text x="246" y="181" fill="#10a37f" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">◉</text>
  <text x="260" y="181" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">OpenAI</text>

  <rect x="314" y="166" width="64" height="22" fill="#323437" rx="4"/>
  <text x="326" y="181" fill="#635bff" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">S</text>
