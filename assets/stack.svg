  <text x="24" y="66" fill="#646669" font-family="'SF Mono', monospace" font-size="9" letter-spacing="1">languages</text>

  <!-- TypeScript -->
  <rect x="110" y="52" width="100" height="22" fill="#323437" rx="4"/>
