<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160">
  <defs>
    <linearGradient id="sb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2c2f"/>
      <stop offset="100%" stop-color="#2c2e31"/>
    </linearGradient>
    <linearGradient id="sb-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3d41" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a3d41" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- card background -->
  <rect x="0" y="0" width="840" height="160" fill="url(#sb-bg)" rx="6" stroke="url(#sb-border)" stroke-width="0.5"/>

  <!-- header -->
  <text x="24" y="30" fill="#646669" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="9" letter-spacing="2">STACK</text>
  <rect x="24" y="36" width="16" height="1.5" fill="#e2b714" opacity="0.5" rx="0.75"/>

  <!-- row 1: languages -->
  <text x="24" y="62" fill="#646669" font-family="'SF Mono', monospace" font-size="9" letter-spacing="1">languages</text>
  <rect x="110" y="52" width="80" height="18" fill="#323437" rx="3"/>
  <text x="120" y="64" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">TypeScript</text>
  <rect x="198" y="52" width="62" height="18" fill="#323437" rx="3"/>
  <text x="208" y="64" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Python</text>
  <rect x="268" y="52" width="44" height="18" fill="#323437" rx="3"/>
  <text x="278" y="64" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">SQL</text>

  <!-- row 2: frontend & frameworks -->
  <text x="24" y="92" fill="#646669" font-family="'SF Mono', monospace" font-size="9" letter-spacing="1">frameworks</text>
  <rect x="110" y="80" width="54" height="18" fill="#323437" rx="3"/>
  <text x="120" y="92" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">React</text>
  <rect x="172" y="80" width="62" height="18" fill="#323437" rx="3"/>
  <text x="182" y="92" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Next.js</text>
  <rect x="242" y="80" width="62" height="18" fill="#323437" rx="3"/>
  <text x="252" y="92" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Node.js</text>
  <rect x="312" y="80" width="62" height="18" fill="#323437" rx="3"/>
  <text x="322" y="92" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">FastAPI</text>

  <!-- row 3: infra & tools -->
  <text x="24" y="122" fill="#646669" font-family="'SF Mono', monospace" font-size="9" letter-spacing="1">infra</text>
  <rect x="110" y="110" width="84" height="18" fill="#323437" rx="3"/>
  <text x="120" y="122" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">PostgreSQL</text>
  <rect x="202" y="110" width="52" height="18" fill="#323437" rx="3"/>
  <text x="212" y="122" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Redis</text>
  <rect x="262" y="110" width="62" height="18" fill="#323437" rx="3"/>
  <text x="272" y="122" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Docker</text>
  <rect x="332" y="110" width="48" height="18" fill="#323437" rx="3"/>
  <text x="342" y="122" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">AWS</text>
  <rect x="388" y="110" width="58" height="18" fill="#323437" rx="3"/>
  <text x="398" y="122" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Vercel</text>

  <!-- right column: AI / integrations -->
  <text x="520" y="62" fill="#646669" font-family="'SF Mono', monospace" font-size="9" letter-spacing="1">ai &amp; integrations</text>
  <rect x="520" y="70" width="76" height="18" fill="#323437" rx="3"/>
  <text x="530" y="82" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">LangChain</text>
  <rect x="604" y="70" width="64" height="18" fill="#323437" rx="3"/>
  <text x="614" y="82" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">OpenAI</text>
  <rect x="520" y="96" width="54" height="18" fill="#323437" rx="3"/>
  <text x="530" y="108" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Stripe</text>
  <rect x="582" y="96" width="108" height="18" fill="#323437" rx="3"/>
  <text x="592" y="108" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">GitHub Actions</text>

  <!-- decorative accent -->
  <rect x="520" y="36" width="16" height="1.5" fill="#e2b714" opacity="0.3" rx="0.75"/>
</svg>
