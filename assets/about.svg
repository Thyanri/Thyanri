<svg xmlns="http://www.w3.org/2000/svg" width="840" height="140" viewBox="0 0 840 140">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2c2f"/>
      <stop offset="100%" stop-color="#2c2e31"/>
    </linearGradient>
    <linearGradient id="ab-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3d41" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a3d41" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="840" height="140" fill="url(#ab-bg)" rx="6" stroke="url(#ab-border)" stroke-width="0.5"/>

  <!-- header -->
  <text x="24" y="30" fill="#646669" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="9" letter-spacing="2">ABOUT</text>
  <rect x="24" y="36" width="16" height="1.5" fill="#e2b714" opacity="0.5" rx="0.75"/>

  <!-- about text -->
  <text x="24" y="62" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500">I build software that needs to work, sell, and scale.</text>

  <text x="24" y="86" fill="#646669" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Focused on product engineering, growth systems, and AI automations.</text>
  <text x="24" y="104" fill="#646669" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Background in gaming and esports — competitive by default.</text>

  <!-- quote accent -->
  <rect x="24" y="118" width="2" height="12" fill="#e2b714" opacity="0.4" rx="1"/>
  <text x="34" y="128" fill="#646669" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-style="italic" opacity="0.7">useful systems over noise.</text>
</svg>
