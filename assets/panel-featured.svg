<svg xmlns="http://www.w3.org/2000/svg" width="260" height="120" viewBox="0 0 260 120">
  <defs>
    <linearGradient id="panel-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3d41" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3a3d41" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- card background -->
  <rect x="1" y="1" width="258" height="118" fill="#2c2e31" rx="4" stroke="url(#panel-border)" stroke-width="1"/>

  <!-- accent top line -->
  <rect x="16" y="16" width="24" height="2" fill="#e2b714" opacity="0.7" rx="1"/>

  <!-- title placeholder -->
  <text x="16" y="44" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">project name</text>

  <!-- description placeholder -->
  <text x="16" y="64" fill="#646669" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" letter-spacing="0.3">short description goes here</text>

  <!-- tag -->
  <rect x="16" y="84" width="48" height="18" fill="#323437" rx="3"/>
  <text x="28" y="96" fill="#646669" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" letter-spacing="0.5">tag</text>
</svg>
