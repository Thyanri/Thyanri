      <stop offset="0%" stop-color="#2a2c2f"/>
      <stop offset="100%" stop-color="#2c2e31"/>
    </linearGradient>
    <linearGradient id="nw-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3d41" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a3d41" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="840" height="120" fill="url(#nw-bg)" rx="6" stroke="url(#nw-border)" stroke-width="0.5"/>

  <!-- header -->
