  <circle cx="32" cy="80" r="2" fill="#e2b714" opacity="0.6"/>
  <text x="42" y="84" fill="#d1d0c5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Building AI automation pipelines</text>

  <circle cx="32" cy="102" r="2" fill="#e2b714" opacity="0.6"/>
