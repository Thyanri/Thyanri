# github profile metrics
# generates two metric SVG cards for the profile README
# uses lowlighter/metrics — https://github.com/lowlighter/metrics

name: metrics

on:
  schedule:
    # runs daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics-left:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          user: Thyanri
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Phnom_Penh

  # dedicated languages card — includes private repos
  metrics-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate github-languages.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-languages.svg
          user: Thyanri
          template: classic
          base: ""
          config_timezone: Asia/Phnom_Penh

          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_indepth: yes

  metrics-right:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate github-metrics-right.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-right.svg
          user: Thyanri
          template: classic
          base: ""

          # coding habits
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_from: 200

          # follow-up on issues and PRs
          plugin_followup: yes
          plugin_followup_sections: repositories

          # achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
